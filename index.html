<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>현장점검 도구모음</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c3f66">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="점검도구모음">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
  :root{
    --bg:#f2f1ee; --surface:#ffffff; --surface-2:#f6f5f2; --border:#e0ddd6;
    --text:#1d2430; --text-dim:#6b7280; --accent:#1c3f66; --accent-2:#4f9dde;
    --shadow:0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
    --radius:16px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14181f; --surface:#1c222c; --surface-2:#232a35; --border:#2c3542;
      --text:#e8eaed; --text-dim:#9aa4b2; --accent:#5b9bd8; --accent-2:#4f9dde;
      --shadow:0 1px 3px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14181f; --surface:#1c222c; --surface-2:#232a35; --border:#2c3542;
    --text:#e8eaed; --text-dim:#9aa4b2; --accent:#5b9bd8; --accent-2:#4f9dde;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",Roboto,sans-serif;
    min-height:100vh;
    padding-bottom:calc(24px + env(safe-area-inset-bottom));
  }
  header{
    padding:calc(20px + env(safe-area-inset-top)) 20px 20px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  header h1{font-size:1.35rem; margin:0; letter-spacing:-.01em;}
  header p{margin:4px 0 0; color:var(--text-dim); font-size:.88rem;}
  .theme-btn{
    border:1px solid var(--border); background:var(--surface); color:var(--text);
    border-radius:12px; padding:10px 14px; font-size:1rem; cursor:pointer; flex-shrink:0;
  }
  main{padding:0 20px; max-width:900px; margin:0 auto;}
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px;
    margin-top:8px;
  }
  a.card{
    display:block; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:20px; text-decoration:none; color:var(--text);
    box-shadow:var(--shadow); transition:transform .15s ease, box-shadow .15s ease;
    min-height:118px; position:relative;
  }
  a.card:active{transform:scale(.98);}
  .card .icon{font-size:1.8rem; display:block; margin-bottom:10px;}
  .card h2{font-size:1.05rem; margin:0 0 6px; letter-spacing:-.01em;}
  .card p{margin:0; font-size:.83rem; color:var(--text-dim); line-height:1.5;}
  .card.disabled{opacity:.45; pointer-events:none;}
  .card .badge{
    position:absolute; top:16px; right:16px; font-size:.7rem; padding:3px 8px;
    border-radius:999px; background:var(--surface-2); color:var(--text-dim); border:1px solid var(--border);
  }
  .empty-card{
    border:1.5px dashed var(--border); border-radius:var(--radius); padding:20px;
    min-height:118px; display:flex; align-items:center; justify-content:center;
    color:var(--text-dim); font-size:.85rem; text-align:center;
  }
  footer{
    max-width:900px; margin:32px auto 0; padding:0 20px; color:var(--text-dim); font-size:.78rem;
  }
  .install-banner{
    display:none; max-width:900px; margin:0 auto 4px; padding:0 20px;
  }
  .install-banner.show{display:block;}
  .install-banner .inner{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:12px 14px; display:flex; align-items:center; gap:10px; box-shadow:var(--shadow);
    font-size:.85rem;
  }
  .install-banner button{
    border:none; background:var(--accent); color:#fff; border-radius:8px;
    padding:8px 12px; font-size:.82rem; cursor:pointer; flex-shrink:0;
  }
  .install-banner .dismiss{background:transparent; color:var(--text-dim); padding:8px;}
</style>
</head>
<body>
<header>
  <div>
    <h1>현장점검 도구모음</h1>
    <p>건축시설물 정밀안전진단·점검용 현장조사 도구</p>
  </div>
  <button class="theme-btn" id="themeBtn" type="button" title="테마 전환">🌗</button>
</header>

<div class="install-banner" id="installBanner">
  <div class="inner">
    <span style="flex:1;">홈 화면에 추가하면 앱처럼 오프라인으로 바로 실행할 수 있어요.</span>
    <button id="installBtn" type="button">추가</button>
    <button class="dismiss" id="installDismiss" type="button">닫기</button>
  </div>
</div>

<main>
  <div class="grid">
    <a class="card" href="./tools/tilt-survey/index.html">
      <span class="icon">📐</span>
      <h2>건물 기울기 조사</h2>
      <p>측점별 시준각 입력 → 자동 계산(측정높이·변위값·수직변위·등급) → 동별 요약·조사결과표 인쇄</p>
    </a>
    <div class="empty-card">추가 도구 준비 중</div>
    <div class="empty-card">추가 도구 준비 중</div>
  </div>
</main>

<footer>© 현장점검 도구모음 · 오프라인 사용 가능 (PWA)</footer>

<script>
  // ---------- 테마 ----------
  const THEME_KEY = 'sit_theme';
  function applyTheme(t){
    if(t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
  }
  (function initTheme(){
    let saved = null;
    try{ saved = localStorage.getItem(THEME_KEY); }catch(e){}
    applyTheme(saved);
  })();
  document.getElementById('themeBtn').addEventListener('click', () => {
    let cur = null;
    try{ cur = localStorage.getItem(THEME_KEY); }catch(e){}
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const order = prefersDark ? ['dark','light',null] : ['light','dark',null];
    const idx = order.indexOf(cur);
    const next = order[(idx + 1) % order.length];
    applyTheme(next);
    try{
      if(next) localStorage.setItem(THEME_KEY, next);
      else localStorage.removeItem(THEME_KEY);
    }catch(e){}
  });

  // ---------- PWA 설치 배너 ----------
  let deferredPrompt = null;
  const banner = document.getElementById('installBanner');
  const DISMISS_KEY = 'sit_install_dismissed';
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    let dismissed = false;
    try{ dismissed = localStorage.getItem(DISMISS_KEY) === '1'; }catch(err){}
    if(!dismissed) banner.classList.add('show');
  });
  document.getElementById('installBtn').addEventListener('click', async () => {
    if(!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    banner.classList.remove('show');
  });
  document.getElementById('installDismiss').addEventListener('click', () => {
    banner.classList.remove('show');
    try{ localStorage.setItem(DISMISS_KEY, '1'); }catch(e){}
  });

  // ---------- 서비스워커 ----------
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js', { scope: './' }).catch(()=>{});
    });
  }
</script>
</body>
</html>
